<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renova — Tienda de Ropa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="overlay" id="overlay" onclick="closeCart()"></div>

  <!-- HEADER -->
  <header>
    <div class="logo">Renova</div>
    <div class="header-right">
      <button class="theme-btn" onclick="toggleTheme()" title="Cambiar tema" id="themeBtn">🌙</button>
      <button class="cart-btn" onclick="openCart()">
        🛍️ Mi pedido
        <div class="cart-count" id="cartCount">0</div>
      </button>
    </div>
  </header>

  <!-- HERO -->
  <div class="hero">
    <p class="hero-eyebrow">Nueva Colección · 2025</p>
    <h1>MODA <em>URBANA</em><br>QUE TE DEFINE</h1>
    <p>Envíos a todo el país &nbsp;·&nbsp; Pedidos rápidos por WhatsApp</p>
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <span class="filters-label">Ver:</span>
    <button class="filter-btn active" onclick="filterCat('all', this)">Todo</button>
    <button class="filter-btn" onclick="filterCat('poleras', this)">Poleras</button>
    <button class="filter-btn" onclick="filterCat('pantalones', this)">Pantalones</button>
    <button class="filter-btn" onclick="filterCat('chaquetas', this)">Chaquetas</button>
    <button class="filter-btn" onclick="filterCat('accesorios', this)">Accesorios</button>
  </div>

  <!-- CATALOG -->
  <div class="catalog" id="catalog"></div>

  <!-- CART PANEL -->
  <div class="cart-panel" id="cartPanel">
    <div class="cart-header">
      <div class="cart-title">Mi Pedido</div>
      <button class="close-cart" onclick="closeCart()">✕</button>
    </div>

    <div class="cart-items-wrap" id="cartItems">
      <div class="cart-empty">Tu pedido está vacío.<br>Agrega productos del catálogo.</div>
    </div>

    <div class="cart-footer">
      <div class="form-row">
        <label class="form-label">Tu nombre *</label>
        <input class="form-input" id="custName" type="text" placeholder="Ej: María García">
      </div>
      <div class="form-row">
        <label class="form-label">Dirección de entrega *</label>
        <input class="form-input" id="custAddress" type="text" placeholder="Ej: Jr. Los Incas 123, Juliaca">
      </div>
      <div class="form-row">
        <label class="form-label">Notas adicionales</label>
        <input class="form-input" id="custNotes" type="text" placeholder="Color alt, talla especial...">
      </div>
      <div class="cart-total">
        <span class="total-label">Total</span>
        <span class="total-amount" id="totalAmount">S/ 0.00</span>
      </div>
      <button class="whatsapp-btn" onclick="sendWhatsApp()">
        <svg class="wa-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        Enviar pedido por WhatsApp
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <footer>
    © 2025 Renova — Moda Urbana &nbsp;·&nbsp; Pedidos por WhatsApp
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
